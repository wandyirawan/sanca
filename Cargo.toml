[package]
name = "sanca"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "limit"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
