[package]
name = "sanca"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "limit", "compression-gzip"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
askama = "0.16.1"
rust-embed = "8.13.0"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros", "migrate", "json"] }
time = { version = "0.3", features = ["serde", "macros"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
argon2 = "0.6.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
secrecy = "0.10"
zeroize = "1"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
tracing-appender = "0.2.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Debug dev: debuginfo seminimal mungkin. Backtrace tetap menyebut nomor baris,
# tetapi variabel lokal tidak tersedia saat debugger. Ini memotong ukuran target/
# secara besar karena semua dependency ikut membawa debuginfo.
[profile.dev]
debug = "line-tables-only"

# Rilis: biner kecil dan cepat start, sesuai AGENTS.md §10.
[profile.release]
lto = "thin"
strip = true
panic = "abort"
