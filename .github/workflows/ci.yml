name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: fmt, clippy, test, deny, docker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sanca
          POSTGRES_PASSWORD: sanca
          POSTGRES_DB: sanca_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanca -d sanca_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQLX_OFFLINE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (pin dari rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: SQLX_OFFLINE=true cargo test --all-features
        env:
          DATABASE_URL: postgres://sanca:sanca@localhost:5432/sanca_ci
          SANCA_ENV: dev
        run: cargo test --all-features

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

      - name: docker build
        run: docker build -t sanca:local .
