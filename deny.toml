# cargo-deny configuration for Sanca.
# Dijalankan di CI via `cargo deny check`. Lisensi dibatasi ke OSI umum;
# duplicate dependency tidak di-hard-block (warn saja) supaya tidak memblokir build.

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
]
confidence-threshold = 0.8
exceptions = [
  # ring memakai lisensi gabungan MIT + ISC + OpenSSL
  { allow = ["MIT", "ISC", "OpenSSL"], name = "ring" },
  # aws-lc-rs (provider alternatif rustls) memakai Apache-2.0 + ISC + OpenSSL
  { allow = ["Apache-2.0", "ISC", "OpenSSL"], name = "aws-lc-rs" },
  { allow = ["Apache-2.0", "ISC", "OpenSSL"], name = "aws-lc-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
